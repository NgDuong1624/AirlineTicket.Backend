name: CI Backend

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' # Cập nhật phiên bản .NET nếu dùng bản khác

    - name: Restore dependencies
      run: dotnet restore AirlineTicket.Backend.slnx
      
    - name: Build
      run: dotnet build AirlineTicket.Backend.slnx --configuration Release --no-restore
      
    - name: Test
      run: dotnet test AirlineTicket.Backend.slnx --configuration Release --no-build --verbosity normal
