services:
  airlineticket-api:
    image: airlineticket-backend:prod
    build:
      context: ../../
      dockerfile: Dockerfile
    ports:
      - "${PORT:-5000}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}
      - ConnectionStrings__Redis=${REDIS_CONNECTION_STRING}
      - Cors__AllowedOrigins__0=${CORS_ORIGINS}
      - AiService__ModelStore__ApiKey=${AI_SERVICE_API_KEY}
      - AiService__ModelStore__BaseUrl=${AI_SERVICE_BASE_URL}
      - AiService__ModelStore__Model=${AI_SERVICE_MODEL}
      - AiService__ModelStore__MaxTokens=${AI_SERVICE_MAX_TOKENS}
      - AiService__ModelStore__Temperature=${AI_SERVICE_TEMPERATURE}
      - AiService__ModelStore__TopP=${AI_SERVICE_TOP_P}
      - AiService__ModelStore__TimeoutSeconds=${AI_SERVICE_TIMEOUT_SECONDS}
      - AiService__ModelStore__EnableThinking=${AI_SERVICE_ENABLE_THINKING}
      - AiService__ModelStore__ReasoningEffort=${AI_SERVICE_REASONING_EFFORT}
      - LuckyPenny__MediatR__LicenseKey=${LUCKY_PENNY_MEDIATR_LICENSE_KEY}
      - Google__ClientId=${GOOGLE_CLIENT_ID}
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: AirlineTicketDb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres-data:
