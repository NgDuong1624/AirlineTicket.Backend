# =============================================================
# LOCAL - Option A: Connect to an EXTERNAL database
# Usage: docker compose -f docker-compose.local.yml up -d
# Requires: DB_HOST, DB_PASSWORD env vars
#
# Option B: Create database with docker-compose.db.yml
# Usage: docker compose -f docker-compose.local.yml -f docker-compose.db.yml up -d
# =============================================================
name: airline-ticket

services:
  airlineticket-api:
    image: airlineticket-backend:local
    build:
      context: ../../
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-5179}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=Host=${DB_HOST:-localhost};Port=${DB_PORT:-5432};Database=${DB_NAME:-AirlineTicketDb};Username=${DB_USER:-postgres};Password=${DB_PASSWORD:-Admin@123};Pooling=${DB_POOLING:-true};Minimum Pool Size=${DB_MIN_POOL_SIZE:-10};Maximum Pool Size=${DB_MAX_POOL_SIZE:-100};
      - ConnectionStrings__Redis=${REDIS_CONNECTION_STRING}
      - Cors__AllowedOrigins__0=${CORS_ORIGINS}
      - AiService__ModelStore__ApiKey=${AI_SERVICE_API_KEY}
      - AiService__ModelStore__BaseUrl=${AI_SERVICE_BASE_URL}
      - AiService__ModelStore__Model=${AI_SERVICE_MODEL}
      - AiService__ModelStore__MaxTokens=${AI_SERVICE_MAX_TOKENS}
      - AiService__ModelStore__Temperature=${AI_SERVICE_TEMPERATURE}
      - AiService__ModelStore__TopP=${AI_SERVICE_TOP_P}
      - AiService__ModelStore__TimeoutSeconds=${AI_SERVICE_TIMEOUT_SECONDS}
      - AiService__ModelStore__EnableThinking=${AI_SERVICE_ENABLE_THINKING}
      - AiService__ModelStore__ReasoningEffort=${AI_SERVICE_REASONING_EFFORT}
      - LuckyPenny__MediatR__LicenseKey=${LUCKY_PENNY_MEDIATR_LICENSE_KEY}
      - Google__ClientId=${GOOGLE_CLIENT_ID}
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - Jwt__KeyId=${JWT_KEY_ID}
    restart: always

  airlineticket-signalr:
    image: airlineticket-backend:local
    build:
      context: ../../
      dockerfile: Dockerfile
    ports:
      - "${SIGNALR_PORT:-5084}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=Host=${DB_HOST:-localhost};Port=${DB_PORT:-5432};Database=${DB_NAME:-AirlineTicketDb};Username=${DB_USER:-postgres};Password=${DB_PASSWORD:-Admin@123};Pooling=${DB_POOLING:-true};Minimum Pool Size=${DB_MIN_POOL_SIZE:-10};Maximum Pool Size=${DB_MAX_POOL_SIZE:-100};
      - ConnectionStrings__Redis=${REDIS_CONNECTION_STRING}
      - Cors__AllowedOrigins__0=${CORS_ORIGINS}
      - AiService__ModelStore__ApiKey=${AI_SERVICE_API_KEY}
      - AiService__ModelStore__BaseUrl=${AI_SERVICE_BASE_URL}
      - AiService__ModelStore__Model=${AI_SERVICE_MODEL}
      - AiService__ModelStore__MaxTokens=${AI_SERVICE_MAX_TOKENS}
      - AiService__ModelStore__Temperature=${AI_SERVICE_TEMPERATURE}
      - AiService__ModelStore__TopP=${AI_SERVICE_TOP_P}
      - AiService__ModelStore__TimeoutSeconds=${AI_SERVICE_TIMEOUT_SECONDS}
      - AiService__ModelStore__EnableThinking=${AI_SERVICE_ENABLE_THINKING}
      - AiService__ModelStore__ReasoningEffort=${AI_SERVICE_REASONING_EFFORT}
      - LuckyPenny__MediatR__LicenseKey=${LUCKY_PENNY_MEDIATR_LICENSE_KEY}
      - Google__ClientId=${GOOGLE_CLIENT_ID}
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - Jwt__KeyId=${JWT_KEY_ID}
    command:
      ["bash", "-c", "cd signalr && exec dotnet AirlineTicket.SignalR.dll"]
    restart: always
